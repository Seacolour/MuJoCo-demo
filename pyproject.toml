[project]
dependencies = ["mujoco>=3.17.0,<4", "pydantic>=2.14.1,<3", "python-dotenv>=1.2.4,<2"]
name = "mujoco-demo"
requires-python = ">=3.12,<3.13"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
mujoco_demo = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"

[tool.pixi.dependencies]
python = "3.12.*"
numpy = ">=2.5.4,<3"
pytest = ">=9.1.1,<10"
pillow = ">=13.0.0,<14"
